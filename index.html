<!DOCTYPE html>
<html>
	<head>
		<title>Guess Baattle</title>

<style>
body{
	font-family:Arial;
	text-align:center;
	background:#0f172a;
	color:white;
	padding-top:50px;
	
} 

     input{
	     padding:10px;
	     font-size:18px;

     }
        
        button{
		padding:10px 20px;
		font-size:18px;
		cursor:pointer;
	}

	.card{
		max-width:500px;
		margin:auto;
		background:#1e293b;
		padding:20px;
		border-radius:15px;
	}

	h1{
		color:#38bdf8;
	}
</style>

	</head>
	<body>

		<div class="card">

			<h1> Guess battle</h1>
			<p>Guess a number from 1 to 20</p>

			<input id="guess" type="number">

			<<button onclick="checkGuess()">
				Guess
			</button>

			<p id="message"></p>

			<P>Attempts: <span id="attempts">0</span></p>

			<p>XP: <span id="xp">0</span></p>

			<p>Level: <span id="level">1</span></p>

		</div>

		<script>
			let secret = Maths.floor(Math.random()*20)+1;
			let attempts = 0;
			let xp = 0;
			let level = 1;

			function checkGuess(){

				let guess =
					parseInt(document.getElementById("guess").value);

				attempts++;

				document.getElementById("attempts").innerText =
					attempts;

				if(guess === secret){

					xp += 10;

					level =
						Math.floor(xp/50)+1;

					document.getElementById("xp").innerText = xp;

					document.getElementById("level").innerText = 
						level;

					document.getElementById("message").innerText = 
						"correct! New number generated,":

					 secret =
						Math,floor(Math.random()*20)+1;

					attempts = 0;

					document.getElementById("attempts").innerText = 
						attempts;

				}
				else if(guess < secret){
					document.getElementById("message").innerText = 
						"Too low";

				}
				else{
					document.getElementById("message").innetText = 
						"Too high";

				}

			}

		</script>

	</body>
</html>
